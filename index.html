<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff2f8"><title>DECO MATCH | かわいいをつくろう</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#3b2941;background:#fff5fa}*{box-sizing:border-box}body{margin:0}main{max-width:550px;margin:auto;padding:18px 15px 50px}h1{font-size:28px;margin:5px 0;color:#d13f86;letter-spacing:1px}.sub{font-size:13px;color:#896b83;margin:0 0 18px}.panel{background:white;border-radius:22px;padding:16px;box-shadow:0 8px 30px #e3a3c12b;margin:13px 0}h2{font-size:15px;margin:0 0 12px}button,.upload{font:inherit;border:0;border-radius:14px;background:#f8e5f1;color:#75345c;padding:11px 13px;font-weight:700;cursor:pointer}button:focus-visible,.upload:focus-visible,input:focus-visible{outline:3px solid #c64788}button.primary,.upload{background:#df4d96;color:white}button.active{background:#d94a93;color:white}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1;min-width:75px}input[type=file]{display:none}input[type=text]{width:100%;padding:12px;border:1px solid #ead1df;border-radius:12px;font-size:16px}canvas{display:block;width:100%;height:auto;border-radius:18px;touch-action:none;background:#ffe2f1}small{color:#907b8a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.status{font-size:13px;color:#875d79;min-height:20px}.footer{text-align:center;font-size:12px;color:#987f90;padding-top:10px}</style></head><body><main><h1>♡ DECO MATCH</h1><p class="sub">写真をかわいくデコって、友達にシェアしよう ✨</p><div class="panel"><h2>① 写真を選ぼう</h2><label class="upload" for="photo">📷 写真をアップロード</label><input id="photo" type="file" accept="image/*"><p><small>写真は端末内で処理します。サーバーには送信しません。</small></p></div><div class="panel"><h2>② デザインを選ぼう</h2><div class="buttons" id="themes"><button data-theme="pink" class="active">🎀 量産型</button><button data-theme="retro">🌼 レトロ</button><button data-theme="korea">🫧 韓国風</button><button data-theme="simple">🤍 シンプル</button></div><h2 style="margin-top:18px">③ 文字を入れよう</h2><input id="message" type="text" maxlength="28" placeholder="例：BESTIES FOREVER ♡" value="BESTIES FOREVER ♡"><h2 style="margin-top:18px">④ スタンプを追加</h2><div class="buttons" id="stickers"><button data-sticker="♡">♡</button><button data-sticker="★">★</button><button data-sticker="🎀">🎀</button><button data-sticker="✨">✨</button><button data-sticker="🌷">🌷</button></div><p><small>スタンプを押して追加。画像上のスタンプを指で動かせます。</small></p><button id="clear">スタンプをすべて消す</button></div><div class="panel"><h2>プレビュー</h2><canvas id="canvas" width="720" height="1280" aria-label="デコ画像プレビュー"></canvas><p class="status" id="status" aria-live="polite"></p><div class="buttons"><button class="primary" id="save">⬇ 画像を保存</button><button id="share">↗ シェア</button></div></div><div class="footer">DECO MATCH • Make it cute. Share it.</div></main><script>
(()=>{'use strict';const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),photo=document.querySelector('#photo'),message=document.querySelector('#message'),status=document.querySelector('#status');let theme='pink',image=null,stamps=[],drag=-1;const themes={pink:{bg:'#ffe3ef',edge:'#f9a8cd',ink:'#b73c7c',detail:'#fff'},retro:{bg:'#fff2c8',edge:'#ffad79',ink:'#bd5e56',detail:'#fffaf0'},korea:{bg:'#e9e5ff',edge:'#a5a2dd',ink:'#6b65a6',detail:'#fff'},simple:{bg:'#f7f5f4',edge:'#cfc8c6',ink:'#686366',detail:'#fff'}};function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function cover(img,x,y,w,h){const ratio=Math.max(w/img.width,h/img.height),sw=w/ratio,sh=h/ratio;ctx.drawImage(img,(img.width-sw)/2,(img.height-sh)/2,sw,sh,x,y,w,h)}function draw(){const t=themes[theme];ctx.fillStyle=t.bg;ctx.fillRect(0,0,720,1280);ctx.fillStyle=t.edge;roundRect(30,30,660,1220,35);ctx.fill();ctx.fillStyle=t.detail;roundRect(48,48,624,1184,28);ctx.fill();ctx.fillStyle=t.bg;roundRect(72,175,576,830,22);ctx.fill();ctx.save();roundRect(84,187,552,806,18);ctx.clip();if(image)cover(image,84,187,552,806);else{ctx.fillStyle=t.bg;ctx.fillRect(84,187,552,806);ctx.textAlign='center';ctx.fillStyle=t.ink;ctx.font='bold 34px system-ui';ctx.fillText('YOUR PHOTO HERE',360,575);ctx.font='70px system-ui';ctx.fillText('♡ ✨ ♡',360,670)}ctx.restore();ctx.strokeStyle=t.edge;ctx.lineWidth=9;roundRect(78,181,564,818,22);ctx.stroke();ctx.textAlign='center';ctx.fillStyle=t.ink;ctx.font='bold 46px system-ui';ctx.fillText(theme==='retro'?'✿  DECO DAYS  ✿':theme==='korea'?'♡  MY MOMENT  ♡':theme==='simple'?'MY MOMENT':'♡  DECO MATCH  ♡',360,120);ctx.font='bold 35px system-ui';let label=message.value.trim()||'BESTIES FOREVER ♡';while(ctx.measureText(label).width>570&&ctx.font.match(/\d+/)&&parseInt(ctx.font.match(/\d+/)[0])>16){ctx.font=ctx.font.replace(/\d+px/,v=>(parseInt(v)-1)+'px')}ctx.fillText(label,360,1081);ctx.font='25px system-ui';ctx.fillText('made with ♡   #DECOMATCH',360,1165);stamps.forEach(s=>{ctx.font='75px system-ui';ctx.textAlign='center';ctx.fillText(s.text,s.x,s.y)})}function pos(e){const r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*720/r.width,y:(e.clientY-r.top)*1280/r.height}}document.querySelector('#themes').addEventListener('click',e=>{const b=e.target.closest('[data-theme]');if(!b)return;theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(x=>x.classList.toggle('active',x===b));draw()});document.querySelector('#stickers').addEventListener('click',e=>{const b=e.target.closest('[data-sticker]');if(!b)return;stamps.push({text:b.dataset.sticker,x:160+Math.random()*400,y:320+Math.random()*500});draw()});document.querySelector('#clear').addEventListener('click',()=>{stamps=[];draw()});message.addEventListener('input',draw);photo.addEventListener('change',()=>{const file=photo.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){status.textContent='画像ファイルを選んでください';return}if(file.size>20*1024*1024){status.textContent='20MB以下の写真を選んでください';return}const url=URL.createObjectURL(file),img=new Image();img.onload=()=>{image=img;URL.revokeObjectURL(url);status.textContent='写真を読み込みました！';draw()};img.onerror=()=>{URL.revokeObjectURL(url);status.textContent='写真を読み込めませんでした'};img.src=url});c.addEventListener('pointerdown',e=>{const p=pos(e);drag=-1;for(let i=stamps.length-1;i>=0;i--){if(Math.hypot(stamps[i].x-p.x,stamps[i].y-p.y)<80){drag=i;break}}if(drag>=0)c.setPointerCapture(e.pointerId)});c.addEventListener('pointermove',e=>{if(drag<0)return;const p=pos(e);stamps[drag].x=Math.max(40,Math.min(680,p.x));stamps[drag].y=Math.max(90,Math.min(1210,p.y));draw()});for(const ev of ['pointerup','pointercancel'])c.addEventListener(ev,()=>drag=-1);function blob(){return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('画像を作成できませんでした')),'image/png'))}document.querySelector('#save').addEventListener('click',async()=>{try{const b=await blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='deco-match.png';document.body.appendChild(a);a.click();a.remove();status.textContent='画像を保存しました。保存されない場合は「シェア」を試してください。';setTimeout(()=>URL.revokeObjectURL(u),60000)}catch(e){status.textContent=e.message}});document.querySelector('#share').addEventListener('click',async()=>{try{const b=await blob(),file=new File([b],'deco-match.png',{type:'image/png'});if(navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'DECO MATCH'})}else if(navigator.share){await navigator.share({title:'DECO MATCH',text:'DECO MATCHでデコ画像を作ったよ！',url:location.href})}else{status.textContent='共有機能が使えません。画像を保存してSNSに投稿してください。'}}catch(e){if(e.name!=='AbortError')status.textContent='共有できませんでした。画像保存をお試しください。'}});draw()})();
</script></body></html>
